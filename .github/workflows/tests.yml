# R11 · Integración continua: pruebas rápidas en cada pull request y en cada push a main.
name: pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas rápidas
        run: pytest -q -m "not lento"
